<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<head>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #stateOutput {
      width: 100%;
      height: 300px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    button {
      margin: 10px 0;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .success {
      background-color: #dff0d8;
      color: #3c763d;
    }
    .error {
      background-color: #f2dede;
      color: #a94442;
    }
  </style>
</head>
<body>
  <h2>Xianyu Login State Extractor</h2>
  <button id="extractBtn">1.点击获取环境+登录状态</button>
  <div id="status"></div>
  <textarea id="stateOutput" readonly></textarea>
  <button id="copyBtn">2.点击复制</button>

  <hr>
  <h3>在当前 Chrome 中运行一次监控</h3>
  <button id="enableScheduledBtn">启用现有 Chrome 的定时任务</button>
  <div id="scheduledStatus" role="status"></div>
  <p>先在此 Chrome 中打开与任务关键词一致的闲鱼搜索结果页。</p>
  <label for="taskName">已启用任务名称</label>
  <input id="taskName" type="text" placeholder="例如 iPad air" style="width: 100%; box-sizing: border-box;">
  <label for="cardLimit">本次最多分析的商品数</label>
  <input id="cardLimit" type="number" min="1" max="50" value="3" style="width: 100%; box-sizing: border-box;">
  <button id="runLocalBtn">从当前闲鱼标签页采集并导入本机项目</button>
  <div id="runLocalStatus" role="status"></div>

  <script src="popup.js"></script>
  <script src="search_cards.js"></script>
  <script src="seller_credit.js"></script>
  <script src="collector.js"></script>
</body>
</html>
